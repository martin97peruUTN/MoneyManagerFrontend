# Render Blueprint — https://render.com/docs/blueprint-spec
# New → Blueprint in Render, or create a Web Service manually (see AGENTS.md).
services:
  - type: web
    name: money-manager-frontend
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: BACKEND_URL
        sync: false
      - key: VITE_API_URL
        value: ""
